<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="../index.html">
            <img src="../img/duck.png" alt="duck" width="50" height="50" />
          </a>
          <button
            class="navbar-toggler border-light-subtle"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="text-white-50"><i class="fa-solid fa-bars"></i></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active text-white-50" href="#"
                  >Catalogo libri</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link text-white-50" href="#">Anagrafica Utenti</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white-50" href="#">Storico Prestiti</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white-50" href="#">Help</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <main class="container-md my-4 g-0">
        <div class="d-flex justify-content-between">
           <h1 class="mb-3">Nuovo Libro</h1>
           <p>* campi obblgatori</p>
        </div>
        <form action="">
            <div class="d-flex my-3">
              <div class="flex-fill me-2">
                <label for="name" class="mb-2 fs-5">*Nome Autore</label>
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Inserisci il nome dell'autore"
                    id="name"
                    required
                  />
                </div>
              </div>
              <div class="flex-fill ms-2">
                <label for="surname" class="mb-2 fs-5">*Cognome Autore</label>
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Inserisci il cognome dell'autore"
                    id="surname"
                    required
                  />
                </div>
              </div>
            </div>
            <div class="my-3">
              <label for="title" class="mb-2 fs-5">*Titolo</label>
              <div class="input-group">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Inserisci il titolo del libro"
                  id="title"
                  required
                />
              </div>
              <p class="text-secondary fs-6">Titolo versione italiana</p>
            </div>
            <div class="row row-cols-1 row-cols-md-3 mt-3 mb-5 gx-4">
              <div class="col">
                <label for="genere" class="mb-2 fs-5">Genere</label>
                <select
                  class="form-select"
                  aria-label="Default select example"
                  id="genere"
                >
                  <option selected>Scegli il genere</option>
                  <option value="1">Commedia</option>
                  <option value="2">Romanzo</option>
                  <option value="3">Thriller</option>
                  <option value="4">Giallo</option>
                  <option value="5">kids</option>
                </select>
              </div>
              <div class="col">
                <label for="year" class="mb-2 fs-5">Anno di pubblicazione</label>
                <div class="input-group">
                  <input
                    type="month"
                    class="form-control"
                    placeholder="Inserisci l'anno"
                    id="year"
                  />
                </div>
              </div>
              <div class="col">
                <label for="ISBN" class="mb-2 fs-5">*ISBN#</label>
                <div class="input-group">
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Inserire il codice ISBN#"
                    id="ISBN"
                    required
                  />
                </div>
              </div>
            </div>
            <div class="pt-5 mb-3 border border-0 border-top">
              <label for="note" class="mb-2 fs-5" aria-required="true">Note</label>
              <textarea
                class="form-control"
                id="note"
                rows="4"
                placeholder="Inserisci eventuali note sul libro"
              ></textarea>
            </div>
            <div class="form-check fs-5">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="check"
              />
              <label class="form-check-label fs-5" for="check">
                Disponibile anche in digitale
              </label>
            </div>
            <button type="submit" class="btn btn-primary my-4 fs-5">Aggiungi Libro</button>
        </form>
      </main>
    </header>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
